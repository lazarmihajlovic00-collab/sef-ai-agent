[project]
name = "sef-ai-agent"
version = "0.1.0"
description = "AI accounts-payable agent for Serbian e-invoices (SEF): 3-way matching, anomaly detection, booking proposals, Serbian Q&A, human approval and audit log."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "lxml>=5.0",
    "httpx>=0.27",
    "anthropic>=0.70",
    "google-genai>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
sef-agent = "sef_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sef_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
